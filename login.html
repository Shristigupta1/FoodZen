<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FoodyZen Login</title>

<link rel="stylesheet" href="login.css">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
<div class="login-page">
<div class="login-left">
<img src="logo.png" class="logo">
<h1>
Welcome Back to
<span>FoodyZen</span>
</h1>
<p>
Every Meal Has A Purpose.
Sign in to order food, donate meals and access your dashboard.
</p>
<img src="login-food.png" class="food-image">
</div>
<div class="login-right">
<div class="login-card">
<h2>Sign In</h2>
<p>
Welcome back! Please enter your details.
</p>
<form id="loginForm">
<div class="input-box">
<i class="fa-regular fa-envelope"></i>
<input
type="email"
id="email"
placeholder="Email Address"
required
>
</div>
<div class="input-box">
<i class="fa-solid fa-lock"></i>
<input
type="password"
id="password"
placeholder="Password"
required
>
<i class="fa-regular fa-eye" id="togglePassword"></i>
</div>
<div class="login-options">
<label>
<input type="checkbox">
Remember me
</label>
<a href="#">
Forgot Password?
</a>
</div>
<button class="login-btn" type="submit">
Login
</button>
<div class="divider">
<span>OR</span>
</div>
<div class="social-login">
<button type="button">

<i class="fa-brands fa-google"></i>
Google
</button>
<button type="button">
<i class="fa-brands fa-facebook-f"></i>
Facebook
</button>
</div>
<p class="signup-link">
Don't have an account?
<a href="signup.html">
Create Account
</a>
</p>
</form>
</div>
</div>
</div>
<div class="zen-float" id="zenFloat">
<img src="zen.png" alt="">
<span>Zen AI</span>
<div class="zen-dot"></div>
</div>
<script src="login.js"></script>
</body>
</html>
