<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FoodyZen | Create Account</title>

<link rel="stylesheet" href="signup.css">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<div class="signup-page">

<div class="signup-left">

<img src="logo.png" class="logo">

<h1>

Join

<span>FoodyZen</span>

Today

</h1>

<p>

Create your account to order healthy meals, rescue food, donate meals and experience Zen AI.

</p>

<img src="login-food.png" class="food-image">

</div>

<div class="signup-right">

<div class="signup-card">

<h2>Create Account</h2>

<p>

Let's get started.

</p>

<form id="signupForm">

<div class="input-box">

<i class="fa-regular fa-user"></i>

<input
type="text"
id="name"
placeholder="Full Name"
required>

</div>

<div class="input-box">

<i class="fa-regular fa-envelope"></i>

<input
type="email"
id="email"
placeholder="Email Address"
required>

</div>

<div class="input-box">

<i class="fa-solid fa-phone"></i>

<input
type="tel"
id="phone"
placeholder="Phone Number"
required>

</div>

<div class="input-box">

<i class="fa-solid fa-lock"></i>

<input
type="password"
id="password"
placeholder="Password"
required>

<i class="fa-regular fa-eye" id="togglePassword"></i>

</div>

<div class="strength">

<div class="strength-bar"></div>

<span id="strengthText">

Password Strength

</span>

</div>

<div class="input-box">

<i class="fa-solid fa-lock"></i>

<input
type="password"
id="confirmPassword"
placeholder="Confirm Password"
required>

</div>

<div class="terms">

<label>

<input type="checkbox" id="terms">

I agree to the Terms & Conditions

</label>

</div>

<button class="signup-btn" type="submit">

Create Account

</button>

<p class="login-link">

Already have an account?

<a href="login.html">

Login

</a>

</p>

</form>

</div>

</div>

</div>

<script src="signup.js"></script>

</body>

</html>
